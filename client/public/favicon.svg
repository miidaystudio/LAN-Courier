<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#favBg)"/>
  <rect x="10" y="10" width="492" height="492" rx="102" stroke="rgba(255, 255, 255, 0.16)" stroke-width="12"/>

  <!-- Top Wi-Fi Waves -->
  <path d="M 160 88 A 120 120 0 0 1 352 88" stroke="url(#wave)" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path d="M 200 130 A 70 70 0 0 1 312 130" stroke="url(#wave)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <circle cx="256" cy="168" r="14" fill="#00F0FF"/>

  <!-- Bottom Wi-Fi Waves -->
  <circle cx="256" cy="344" r="14" fill="#C084FC"/>
  <path d="M 200 382 A 70 70 0 0 0 312 382" stroke="url(#purplePink)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M 160 424 A 120 120 0 0 0 352 424" stroke="url(#purplePink)" stroke-width="26" stroke-linecap="round" fill="none"/>

  <!-- Left: Modern Laptop -->
  <rect x="42" y="196" width="160" height="114" rx="18" fill="#111827" stroke="url(#purplePink)" stroke-width="18"/>
  <rect x="58" y="212" width="128" height="82" rx="8" fill="#0F172A"/>
  <rect x="74" y="228" width="50" height="9" rx="4.5" fill="#00F0FF"/>
  <rect x="74" y="244" width="76" height="9" rx="4.5" fill="#818CF8"/>
  <rect x="74" y="260" width="58" height="9" rx="4.5" fill="#C084FC"/>
  <path d="M 24 320 L 220 320 C 222 334 212 338 200 338 L 44 338 C 32 338 22 334 24 320 Z" fill="url(#purplePink)"/>

  <!-- Center: Bold Glowing File Document -->
  <path d="M 218 206 L 274 206 L 302 234 L 302 308 C 302 320 292 330 280 330 L 218 330 C 206 330 196 320 196 308 L 196 228 C 196 216 206 206 218 206 Z" fill="url(#cyanBlue)"/>
  <path d="M 274 206 L 274 234 L 302 234 Z" fill="#93C5FD"/>
  <path d="M 260 236 L 242 266 L 260 266 L 246 298 L 274 262 L 256 262 Z" fill="#FFFFFF"/>

  <!-- Right: Modern Smartphone -->
  <rect x="310" y="184" width="124" height="170" rx="28" fill="#111827" stroke="url(#purplePink)" stroke-width="18"/>
  <rect x="326" y="200" width="92" height="138" rx="14" fill="#0F172A"/>
  <rect x="350" y="192" width="44" height="6" rx="3" fill="url(#purplePink)"/>
  <rect x="340" y="220" width="64" height="30" rx="8" fill="#00F0FF" opacity="0.35"/>
  <rect x="340" y="260" width="64" height="9" rx="4.5" fill="#818CF8"/>
  <rect x="340" y="276" width="44" height="9" rx="4.5" fill="#C084FC"/>
  <rect x="340" y="298" width="64" height="24" rx="12" fill="url(#cyanBlue)"/>
</svg>

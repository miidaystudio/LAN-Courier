<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 80 400 340" fill="none">
  <defs>
    <!-- Vibrant Gradients -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="purplePinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="bottomWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <filter id="boldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Top Wi-Fi Waves -->
  <g filter="url(#boldGlow)">
    <path d="M 160 110 A 90 90 0 0 1 300 110" stroke="url(#waveGrad)" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 190 142 A 52 52 0 0 1 270 142" stroke="url(#waveGrad)" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="230" cy="172" r="9" fill="#00F0FF"/>
  </g>

  <!-- Bottom Wi-Fi Waves -->
  <g filter="url(#boldGlow)">
    <circle cx="230" cy="328" r="9" fill="#8B5CF6"/>
    <path d="M 190 358 A 52 52 0 0 0 270 358" stroke="url(#bottomWaveGrad)" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M 160 390 A 90 90 0 0 0 300 390" stroke="url(#bottomWaveGrad)" stroke-width="18" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Dynamic Directional Beam Transfer Arrows -->
  <!-- Top Arrow (Left to Right) -->
  <g filter="url(#boldGlow)">
    <path d="M 165 220 C 185 200 220 198 270 210" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <polygon points="288,214 266,198 270,224" fill="#00F0FF"/>
  </g>

  <!-- Bottom Arrow (Right to Left) -->
  <g filter="url(#boldGlow)">
    <path d="M 295 280 C 275 300 240 302 190 290" stroke="url(#bottomWaveGrad)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <polygon points="172,286 194,302 190,276" fill="#8B5CF6"/>
  </g>

  <!-- Left: Modern Laptop -->
  <g id="laptop" filter="url(#boldGlow)">
    <!-- Screen Body -->
    <rect x="42" y="195" width="140" height="98" rx="16" fill="#090D16" stroke="url(#purplePinkGrad)" stroke-width="16"/>
    <!-- Screen Inner Display -->
    <rect x="56" y="208" width="112" height="72" rx="8" fill="#1E1B4B" opacity="0.8"/>
    <!-- Screen Code / UI Lines -->
    <rect x="70" y="222" width="42" height="7" rx="3.5" fill="#00F0FF"/>
    <rect x="70" y="236" width="64" height="7" rx="3.5" fill="#818CF8"/>
    <rect x="70" y="250" width="50" height="7" rx="3.5" fill="#C084FC"/>
    <!-- Laptop Base Deck -->
    <path d="M 30 302 L 194 302 C 196 312 188 316 178 316 L 46 316 C 36 316 28 312 30 302 Z" fill="url(#purplePinkGrad)"/>
    <!-- Trackpad Highlight -->
    <rect x="94" y="302" width="36" height="5" rx="2.5" fill="#00F0FF"/>
  </g>

  <!-- Center: Bold Glowing File Document -->
  <g id="file" filter="url(#boldGlow)">
    <path d="M 198 212 L 244 212 L 268 236 L 268 298 C 268 308 260 316 250 316 L 198 316 C 188 316 180 308 180 298 L 180 230 C 180 220 188 212 198 212 Z" fill="url(#cyanBlueGrad)"/>
    <!-- Corner Fold -->
    <path d="M 244 212 L 244 236 L 268 236 Z" fill="#93C5FD"/>
    <!-- Center Bolt / P2P Symbol -->
    <path d="M 228 238 L 214 262 L 228 262 L 218 286 L 238 258 L 224 258 Z" fill="#FFFFFF"/>
  </g>

  <!-- Right: Modern Smartphone -->
  <g id="phone" filter="url(#boldGlow)">
    <!-- Phone Body -->
    <rect x="286" y="185" width="104" height="142" rx="22" fill="#090D16" stroke="url(#purplePinkGrad)" stroke-width="16"/>
    <!-- Screen Display -->
    <rect x="298" y="198" width="80" height="116" rx="12" fill="#1E1B4B" opacity="0.8"/>
    <!-- Top Speaker -->
    <rect x="320" y="192" width="36" height="5" rx="2.5" fill="url(#purplePinkGrad)"/>
    <!-- UI App Cards inside Phone -->
    <rect x="310" y="215" width="56" height="26" rx="7" fill="#00F0FF" opacity="0.3"/>
    <rect x="310" y="248" width="56" height="7" rx="3.5" fill="#818CF8"/>
    <rect x="310" y="260" width="38" height="7" rx="3.5" fill="#C084FC"/>
    <rect x="310" y="280" width="56" height="20" rx="10" fill="url(#cyanBlueGrad)"/>
    <!-- Home Bar -->
    <rect x="322" y="318" width="32" height="4" rx="2" fill="#00F0FF"/>
  </g>
</svg>
